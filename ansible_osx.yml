---
- hosts: localhost
  vars:
    git_user_name: James Irving-Swift
    git_user_email: james@irving-swift.com
  tasks:
    - name: Install homebrew
      include_role:
        name: geerlingguy.mac.homebrew

    - name: Make sure homebrew bin is in path
      ansible.builtin.lineinfile:
        path: /etc/paths
        state: present
        line: '/opt/homebrew/bin'
      become: true
      become_user: root

    - name: 'add custom homebrew repos'
      community.general.homebrew_tap:
        name: [
          'stripe/stripe-cli',
        ]

    - name: Install core packages via brew casks
      community.general.homebrew_cask:
        name: "{{ item }}"
      ignore_errors: yes
      with_items:
        - datagrip
        - superhuman
        - whatsapp
        - raycast
        - google-drive
        - android-studio
        - slack
        - orbstack
        - claude
        - vorssaint
        - cmux
        - zed
        - discord
        - steam
        - focusrite-control
        - android-platform-tools
        - android-commandlinetools

    - name: "Install homebrew packages"
      community.general.homebrew:
        name: [
          'doctl',
          'tree',
          'dockutil',
          'fzf',
          'imagemagick@6',
          'mas',
          'gh',
          'go',
          'pnpm',
          'gitmoji',
          'neovim',
          'nvm',
          'ffmpeg',
          'mysql-client',
          'uv',
          'fastlane',
          'python3',
          'openai-whisper',
          'awscli',
          'bundletool',
          'cocoapods',
          'composer',
          'doppler',
          'gitleaks',
          'mkcert',
          'nmap',
          'openjdk@17',
          'pipx',
          'wget',
          'yt-dlp',
          'vips',
          'stripe/stripe-cli/stripe'
        ]
        state: present
        update_homebrew: yes

    - name: "Install from Mac app store"
      shell: mas install {{ item }}
      with_items:
        - 497799835 # xcode

    - name: Accept the Xcode licence
      shell: xcodebuild -license accept
      become: true

    - name: "Uninstall from Mac app store"
      shell: mas uninstall {{ item }}
      with_items:
      - 409183694 #keynote
      - 409203825 #numbers
      - 409201541 #pages
      - 408981434 #imovie
      become: true
      ignore_errors: true

    # Dock: remove the default clutter, then add the apps I actually use. Each
    # step uses --no-restart and the Dock is restarted once at the end, only if
    # something changed. Re-run just this part with: bin/apply --tags dock
    - name: Clean up dock
      shell: dockutil --find '{{ item }}' && dockutil --remove '{{ item }}' --no-restart
      with_items:
        - Keynote
        - Numbers
        - Pages
        - Freeform
        - Contacts
        - Maps
        - Mail
        - Messages
        - TV
        - App Store
        - Safari
        - System Settings
        - FaceTime
      register: dock_remove
      failed_when: false
      changed_when: dock_remove.rc == 0
      tags: dock

    - name: Add apps to dock
      shell: dockutil --find '{{ item.name }}' || dockutil --add '{{ item.path }}' --no-restart
      with_items:
        - { name: Apps, path: /System/Applications/Apps.app }
        - { name: Photos, path: /System/Applications/Photos.app }
        - { name: Calendar, path: /System/Applications/Calendar.app }
        - { name: Reminders, path: /System/Applications/Reminders.app }
        - { name: Music, path: /System/Applications/Music.app }
        - { name: Superhuman, path: /Applications/Superhuman.app }
        - { name: WhatsApp, path: /Applications/WhatsApp.app }
        - { name: Notes, path: /System/Applications/Notes.app }
      register: dock_add
      changed_when: "'added' in dock_add.stdout"
      tags: dock

    - name: Add Downloads folder to dock
      shell: dockutil --find Downloads || dockutil --add ~/Downloads --section others --no-restart
      register: dock_downloads
      changed_when: "'added' in dock_downloads.stdout"
      tags: dock

    - name: Restart dock
      shell: killall Dock
      when: dock_remove.changed or dock_add.changed or dock_downloads.changed
      tags: dock

    # macOS preferences, captured from the machine with `defaults read`.
    # Re-run just this part with: bin/apply --tags defaults
    - name: Set macOS defaults
      community.general.osx_defaults:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        type: "{{ item.type }}"
        value: "{{ item.value }}"
      with_items:
        # Dark mode (takes effect at next login)
        - { domain: NSGlobalDomain, key: AppleInterfaceStyle, type: string, value: Dark }
        # Dock: auto-hide, 64px icons
        - { domain: com.apple.dock, key: autohide, type: bool, value: true }
        - { domain: com.apple.dock, key: tilesize, type: float, value: 64 }
        # Finder: column view, path bar, open new windows at Computer, no "change extension?" nag
        - { domain: com.apple.finder, key: FXPreferredViewStyle, type: string, value: clmv }
        - { domain: com.apple.finder, key: ShowPathbar, type: bool, value: true }
        - { domain: com.apple.finder, key: NewWindowTarget, type: string, value: PfCm }
        - { domain: com.apple.finder, key: FXEnableExtensionChangeWarning, type: bool, value: false }
        - { domain: com.apple.finder, key: ShowHardDrivesOnDesktop, type: bool, value: false }
        - { domain: com.apple.finder, key: ShowExternalHardDrivesOnDesktop, type: bool, value: true }
      register: osx_defaults
      tags: defaults

    - name: Restart Finder and Dock to pick up new defaults
      shell: killall Finder Dock
      when: osx_defaults.changed
      tags: defaults

    - name: Install Oh My ZSH
      shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/robbyrussell/oh-my-zsh/master/tools/install.sh)"
      args:
        creates: "/Users/{{ lookup('env', 'USER') }}/.oh-my-zsh"

    - name: "Create a default ZSH configuration"
      template:
        src: templates/.zshrc.j2
        dest: /Users/{{ lookup('env', 'USER') }}/.zshrc
        owner: "{{ lookup('env', 'USER') }}"
        force: yes

    # Dotfiles. Like ~/.zshrc these are overwritten on every run, so edit the
    # copies in templates/ rather than the files in $HOME.
    - name: Ensure dotfile directories exist
      file:
        path: "/Users/{{ lookup('env', 'USER') }}/{{ item }}"
        state: directory
      with_items:
        - .config/nvim
        - .config/git

    - name: Create git config
      template:
        src: templates/.gitconfig.j2
        dest: /Users/{{ lookup('env', 'USER') }}/.gitconfig
        owner: "{{ lookup('env', 'USER') }}"
        force: yes

    - name: Create global git ignore
      copy:
        src: templates/gitignore_global
        dest: /Users/{{ lookup('env', 'USER') }}/.config/git/ignore
        owner: "{{ lookup('env', 'USER') }}"
        force: yes

    - name: Create Neovim config
      copy:
        src: templates/init.vim
        dest: /Users/{{ lookup('env', 'USER') }}/.config/nvim/init.vim
        owner: "{{ lookup('env', 'USER') }}"
        force: yes

    - name: Ensure nvm working directory exists
      file:
        path: "/Users/{{ lookup('env', 'USER') }}/.nvm"
        state: directory

    - name: Install latest LTS node via nvm
      shell: |
        set -e
        export NVM_DIR="$HOME/.nvm"
        source /opt/homebrew/opt/nvm/nvm.sh
        nvm install --lts
        nvm alias default 'lts/*'
        node_path="$(nvm which default)"
        [[ "$node_path" = /* ]] || { echo "nvm could not resolve the default node: '$node_path'" >&2; exit 1; }
        dirname "$node_path"
      args:
        executable: /bin/bash
      register: nvm_node

    # A shell task can't change the PATH of later tasks, so give the pnpm tasks
    # the same PNPM_HOME and node PATH that templates/.zshrc.j2 sets up.
    - name: Run pnpm setup
      shell: pnpm setup
      environment:
        PNPM_HOME: "{{ lookup('env', 'HOME') }}/Library/pnpm"

    - name: Install EAS CLI node.js package.
      community.general.pnpm:
        name: eas-cli
        global: true
      environment:
        PNPM_HOME: "{{ lookup('env', 'HOME') }}/Library/pnpm"
        PATH: "{{ lookup('env', 'HOME') }}/Library/pnpm:{{ nvm_node.stdout_lines[-1] }}:{{ lookup('env', 'PATH') }}"
