---
- hosts: localhost
  tasks:
    - name: Install homebrew
      include_role:
        name: geerlingguy.mac.homebrew

    - name: Make sure homebrew bin is in path
      ansible.builtin.lineinfile:
        path: /etc/paths
        state: present
        line: '/opt/homebrew/bin'
      become: true
      become_user: root

    - name: 'add custom homebrew repos'
      community.general.homebrew_tap:
        name: [
          #homebrew/cask-versions,
        ]

    - name: Install core packages via brew casks
      community.general.homebrew_cask:
        name: "{{ item }}"
      ignore_errors: yes
      with_items:
        - warp
        - datagrip
        - superhuman
        - whatsapp
        - ghostty
        - raycast
        - google-drive
        - android-studio
        - slack
        - orbstack
        - claude
        - vorssaint
        - cmux

    - name: "Install homebrew packages"
      community.general.homebrew:
        name: [
          'doctl',
          'tree',
          'dockutil',
          'fzf',
          'imagemagick@6',
          'mas',
          'gh',
          'go',
          'focusrite-control',
          'pnpm',
          'gitmoji',
          'neovim',
          'nvm',
          'ffmpeg',
          'mysql-client',
          'uv',
          'fastlane',
          'python3',
          'openai-whisper',
          'zed'
        ]
        state: present
        update_homebrew: yes

    - name: "Install from Mac app store"
      shell: mas install {{ item }}
      with_items:
        - 497799835 # xcode

    - name: Accept the Xcode licence
      shell: xcodebuild -license accept
      become: true

    - name: "Uninstall from Mac app store"
      shell: mas uninstall {{ item }}
      with_items:
      - 409183694 #keynote
      - 409203825 #numbers
      - 409201541 #pages
      - 408981434 #imovie
      become: true
      ignore_errors: true

    # Clean up dock
    - name: Clean up dock
      shell: dockutil --remove '{{ item }}'
      with_items:
        - Keynote
        - Numbers
        - Pages
        - Freeform
        - Contacts
        - Maps
        - Mail
        - Messages
        - Notes
        - TV
        - App Store
        - Safari
        - System Settings
        - FaceTime
      ignore_errors: true

    - name: Install Oh My ZSH
      shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/robbyrussell/oh-my-zsh/master/tools/install.sh)"
      args:
        creates: "/Users/{{ lookup('env', 'USER') }}/.oh-my-zsh"

    - name: "Create a default ZSH configuration"
      template:
        src: templates/.zshrc.j2
        dest: /Users/{{ lookup('env', 'USER') }}/.zshrc
        owner: "{{ lookup('env', 'USER') }}"
        force: yes

    - name: Ensure nvm working directory exists
      file:
        path: "/Users/{{ lookup('env', 'USER') }}/.nvm"
        state: directory

    - name: Install latest LTS node via nvm
      shell: |
        export NVM_DIR="$HOME/.nvm"
        source /opt/homebrew/opt/nvm/nvm.sh
        nvm install --lts
        nvm alias default 'lts/*'
        dirname "$(nvm which default)"
      args:
        executable: /bin/bash
      register: nvm_node

    # A shell task can't change the PATH of later tasks, so give the pnpm tasks
    # the same PNPM_HOME and node PATH that templates/.zshrc.j2 sets up.
    - name: Run pnpm setup
      shell: pnpm setup
      environment:
        PNPM_HOME: "{{ lookup('env', 'HOME') }}/Library/pnpm"

    - name: Install EAS CLI node.js package.
      community.general.pnpm:
        name: eas-cli
        global: true
      environment:
        PNPM_HOME: "{{ lookup('env', 'HOME') }}/Library/pnpm"
        PATH: "{{ lookup('env', 'HOME') }}/Library/pnpm:{{ nvm_node.stdout_lines[-1] }}:{{ lookup('env', 'PATH') }}"
